[package]
name = "merframe"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "merframe"

[lib]
name = "merframe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
indexmap = { workspace = true }
keyring-core = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true, features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
wf-core = { workspace = true }
wf-data = { workspace = true, features = ["fetch"] }
wf-inventory = { workspace = true }
wf-log = { workspace = true }
wf-market = { workspace = true, features = ["fetch"] }
wf-mem = { workspace = true }
wf-scan = { workspace = true }
wf-worldstate = { workspace = true, features = ["fetch"] }

[target.'cfg(target_os = "linux")'.dependencies]
gdk = { workspace = true }
gtk = { workspace = true }
notify-rust = { workspace = true }
dbus-secret-service-keyring-store = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
windows-native-keyring-store = { workspace = true }

[features]
bindings = ["dep:ts-rs", "wf-core/bindings", "wf-data/bindings", "wf-market/bindings", "wf-worldstate/bindings"]
schema = ["dep:schemars", "wf-core/schema"]

[lints]
workspace = true

[[bin]]
name = "generate-sse-spec"
path = "src/bin/generate-sse-spec.rs"
required-features = ["schema"]
